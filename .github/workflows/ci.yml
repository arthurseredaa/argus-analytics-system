name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: pnpm exec playwright install chromium
      # The runner image usually has every library Chromium links against; install-deps then only
      # adds fonts the quiz test does not need, and a slow apt mirror can take minutes for them.
      # So apt runs only when ldd reports a missing library.
      - name: Install missing Chromium system libraries
        timeout-minutes: 6
        run: |
          bin=$(find ~/.cache/ms-playwright -type f \( -name chrome-headless-shell -o -name headless_shell \) | head -n 1)
          if [ -n "$bin" ] && ! ldd "$bin" | grep -q "not found"; then
            echo "all system libraries present for $bin, apt skipped"
          else
            pnpm exec playwright install-deps chromium
          fi
      - name: Write .dev.vars
        run: |
          cat > .dev.vars <<EOF
          MASTER_KEY=$(openssl rand -base64 32)
          EMAIL_HASH_KEY=$(openssl rand -base64 32)
          PARTNER_SECRET_PARTNERA=$(openssl rand -base64 32)
          PARTNER_SECRET_PARTNERB=$(openssl rand -base64 32)
          TEST_ROUTES=on
          GIT_SHA=ci
          EOF
      - run: pnpm migrate:local
      - run: pnpm seed --local
      - run: pnpm test:browser
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: argus-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # This is the demo deployment: the test routes are on (R-12, decision 1). A production
      # deploy leaves --var TEST_ROUTES:on out and the routes answer 404.
      - run: pnpm exec wrangler deploy --var GIT_SHA:${{ github.sha }} --var TEST_ROUTES:on
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
